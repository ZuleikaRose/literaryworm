# Supabase CLI settings for this project (only the parts that differ from the defaults).

[functions.books]
# Public: anonymous visitors browse and search. The function validates every
# parameter and rate limits each IP instead of requiring a login.
verify_jwt = false

[functions.manage-profile]
verify_jwt = true

[functions.checkout]
verify_jwt = true

[functions.manage-account]
verify_jwt = true

[functions.dictionary]
# Public like books: the demo household reads without a session. The function
# validates the word and rate limits each IP.
verify_jwt = false

[functions.summaries]
# Public like books: the demo household reads without a session. The function
# validates the id, rate limits each IP, and limits how many new summaries
# (Claude calls) are written per IP and per day.
verify_jwt = false

[functions.ask]
# Public like summaries: the demo household asks without a session. The function
# validates every field, answers only for public-domain catalog titles, and limits
# questions (Claude calls) per IP and per day.
verify_jwt = false

[functions.whats-new]
# Called by pg_cron on the 1st to the 3rd of each month, which sends no Supabase token: the
# function checks the Authorization header against the whats_new_secret kept in Vault instead.
verify_jwt = false

[functions.unsubscribe]
# One-click unsubscribe from mail apps and signed-out readers: the HMAC-signed token in the
# link (checked against the unsubscribe_secret in Vault) is the check, and it can only turn
# the monthly email off.
verify_jwt = false

[functions.characters]
# Public like ask: the demo household uses Who's who without a session. The function
# validates every field, works only for public-domain catalog titles, keeps each list,
# and limits new lists (Claude calls) per IP and per day.
verify_jwt = false

[functions.stripe-webhook]
# Called by Stripe, which sends no Supabase token: every request's Stripe-Signature is
# checked against STRIPE_WEBHOOK_SECRET instead, and unsigned or forged events are refused.
verify_jwt = false

[functions.club-invite]
verify_jwt = true

[functions.release-emails]
# Called every hour by pg_cron, which sends no Supabase token: the function checks the
# Authorization header against the release_emails_secret kept in Vault instead.
verify_jwt = false

[functions.author-news]
# Called by pg_cron (daily checks, Monday emails), which sends no Supabase token: the function
# checks the Authorization header against the author_news_secret kept in Vault instead.
verify_jwt = false

[functions.club-meetings]
# Called by pg_cron every hour, which sends no Supabase token: the function checks the
# Authorization header against the club_meetings_secret kept in Vault instead.
verify_jwt = false

[functions.kids-report]
# Called by pg_cron on Monday and Tuesday mornings, which sends no Supabase token: the function
# checks the Authorization header against the kids_report_secret kept in Vault instead.
verify_jwt = false

[functions.gift-reminders]
# Called by pg_cron every hour, which sends no Supabase token: the function checks the
# Authorization header against the gift_reminders_secret kept in Vault instead.
verify_jwt = false

[functions.club-calendar]
# Calendar apps read the feed with no Supabase token (the link is signed with the
# club_calendar_secret kept in Vault); asking for a link checks the session itself.
verify_jwt = false

# Two-step sign-in with an authenticator app (on by default on hosted projects; the CLI's default is off).
[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

# Auth emails, sent through Mailgun's SMTP in production (set in the dashboard, with the sender).
# The same templates are pasted into Authentication → Email Templates there.
[auth]
# Where local Auth emails send people back to: the dev server (5173), or a second one on 5180.
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/**", "http://localhost:5180/**"]

[auth.email]
# Hosted projects confirm new addresses by default; the CLI's default is off.
enable_confirmations = true

[auth.email.template.confirmation]
subject = "Confirm your email address for LiteraryWorm"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Reset your LiteraryWorm password"
content_path = "./supabase/templates/recovery.html"
