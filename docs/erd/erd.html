<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>LiteraryWorm ERD</title>
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #f6f5f2;
        --dot: #dcd8d0;
        --card: #ffffff;
        --line: #e6e2da;
        --ink: #1d1f21;
        --muted: #6b7075;
        --pk: #b8692a;
        --fk: #2f6f9c;
        --edge: #8d8a84;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: "DM Sans", system-ui, sans-serif;
        color: var(--ink);
        background-color: var(--bg);
        background-image: radial-gradient(var(--dot) 1.2px, transparent 1.2px);
        background-size: 22px 22px;
      }
      #canvas { position: relative; width: 1680px; padding: 40px; }
      header { display: flex; align-items: baseline; gap: 18px; margin-bottom: 8px; }
      header h1 { margin: 0; font-size: 26px; letter-spacing: -0.02em; }
      header p { margin: 0; color: var(--muted); font-size: 14px; }
      .legend { display: flex; gap: 22px; margin: 6px 0 28px; color: var(--muted); font-size: 13px; }
      .legend span { display: inline-flex; align-items: center; gap: 6px; }
      .groups { position: relative; }
      .group-label {
        position: absolute; font-size: 12px; font-weight: 700; letter-spacing: 0.08em;
        text-transform: uppercase; color: var(--muted);
      }
      .table {
        position: absolute; width: 330px; background: var(--card); border-radius: 10px;
        box-shadow: 0 1px 0 var(--line), 0 10px 24px #2a201814; overflow: hidden;
        border: 1px solid var(--line);
      }
      .table h2 {
        margin: 0; padding: 11px 14px; color: #fff; font-size: 15px; font-weight: 700;
        display: flex; justify-content: space-between; align-items: center;
      }
      .table h2 small { font-weight: 500; opacity: 0.85; font-size: 11px; }
      .row {
        display: grid; grid-template-columns: 38px 1fr auto; gap: 6px; align-items: center;
        padding: 6px 14px; border-top: 1px solid var(--line); font-size: 13px;
      }
      .row .k { font-size: 10px; font-weight: 700; }
      .row .k.pk { color: var(--pk); }
      .row .k.fk { color: var(--fk); }
      .row .name { font-weight: 500; }
      .row .type { font-family: "JetBrains Mono", monospace; font-size: 11.5px; color: var(--muted); }
      .row .null { color: #b0b4b8; }
      .note { padding: 8px 14px 10px; border-top: 1px solid var(--line); font-size: 11.5px; color: var(--muted); background: #faf9f6; }
      svg#edges { position: absolute; inset: 0; overflow: visible; pointer-events: none; }
      .edge { fill: none; stroke: var(--edge); stroke-width: 1.6; }
      .card-label { font: 600 11px "DM Sans", sans-serif; fill: var(--muted); }
    </style>
  </head>
  <body>
    <div id="canvas">
      <header>
        <h1>LiteraryWorm database</h1>
        <p id="subtitle"></p>
      </header>
      <div class="legend">
        <span><b style="color: var(--pk)">PK</b> primary key</span>
        <span><b style="color: var(--fk)">FK</b> foreign key</span>
        <span>? nullable</span>
        <span>RLS enabled on every table · every foreign key indexed</span>
      </div>
      <div class="groups" id="groups"></div>
    </div>

    <script>
      // ---- Keep in sync with schema.sql -------------------------------------------------
      const subtitle = "Supabase PostgreSQL · generated schema.sql (migrations 0100–4204, with the legal page rows added 29 Oct)";

            ["", "display_name", "text 1–60"],
            ["", "created_at", "timestamptz"],
            ["", "updated_at", "timestamptz"],

            ["", "update_emails", "boolean (off)"],
            ["", "terms_accepted_at", "timestamptz"],
            ["", "created_at", "timestamptz"],
            ["", "updated_at", "timestamptz"],

        {

            ["", "raw_user_meta_data", "jsonb"],

        {

            ["fk", "plan_id", "text"],
            ["", "status", "subscription_status"],
            ["", "billing_day", "smallint 1–28", true],
            ["", "renewal_terms_accepted_at", "timestamptz", true],

        {

            ["", "share_slug", "text (22, unique)", true],

        },
        {
          id: "club_members", color: colors.reading, x: 1260, y: 2050, sub: "up to 50 a club",

        },
        {

            ["", "label", "text 1–60"],
            ["", "last_seen_at", "timestamptz"],
            ["", "created_at", "timestamptz"],
          ],
          note: "Unique (id, user_id). Index: (user_id, last_seen_at). Checks in every minute through touch_listening_device(); 20 kept an account. RLS: owner only; browser sets id, user_id and label.",
        },
        {
          id: "support_lookups", color: colors.server, x: 840, y: 5080, sub: "member lookup record",

          note: "Written only by support_member_lookup() (customer service and admins; 60 an hour). Both FKs on delete set null, indexed. RLS: admins read. Deleted after a year by pg_cron.",

        {

          note: "Index: user_id. Places are taken only through claim_offline_device(), which checks plans.download_devices (Basic 1, Standard 3, Premium 5). RLS: owner reads and frees (deletes) their own.",
        },
        {
          id: "playback_handoffs", color: colors.household, x: 420, y: 2420, sub: "listen on another device",

            ["fk", "to_device_id", "uuid"],
            ["", "created_at", "timestamptz"],
            ["", "claimed_at", "timestamptz", true],
          ],
          note: "FK (to_device_id, user_id) → listening_devices and (profile_id, user_id) → reader_profiles, on delete cascade; both indexed. Sent by Realtime. RLS: owner only; browser sets claimed_at only after sending.",

          ],
          note: "Which book a profile finished on which day. FK as reading_goals. Index: (user_id, finished_on). Written through record_reading(). RLS: owner only.",

        {
          id: "uploaded_books", color: colors.household, x: 420, y: 2850, sub: "EPUBs a profile added",
          cols: [
            ["pk", "id", "text (u- + 32 hex)"],
            ["fk", "profile_id", "uuid"],
            ["fk", "user_id", "uuid"],
            ["", "title", "text 1–200"],
            ["", "author", "text ≤ 200"],
            ["", "chapter_titles", "text[] 1–500"],
            ["", "chapter_words", "integer[]"],
            ["", "words", "integer"],
            ["", "storage_path", "text (unique)"],
            ["", "created_at", "timestamptz"],
          ],
          note: "The text is JSON in the private user-books bucket, at <user_id>/<id>.json (Storage RLS: own folder only, 15 MB). The id is a valid volume id, so the library, progress and highlights work. FK (profile_id, user_id) → reader_profiles, on delete cascade; indexed, and user_id. Not on Kids profiles; up to 50. RLS: owner only.",
        },
        {
          id: "club_listening", color: colors.reading, x: 1260, y: 2850, sub: "listen along · one a club",
          cols: [
            ["pk fk", "club_id", "uuid"],

          ],
          note: "FK club_id → book_clubs and (club_id, host_id) → club_members, on delete cascade; indexed. Sent by Realtime. RLS: members read; the host moves it; any member takes over one left for two minutes; the host or owner ends it.",
        },
        {

            ["pk fk", "user_id", "uuid"],

            ["fk", "granted_by", "uuid", true],
          ],
          note: "Roles: admin, developer, editor, billing, customer_service, blog, sales (admins can do everything). Granted and removed only by admins through grant_staff_role() / revoke_staff_role(); the last admin stays. Granting a first role (any) starts a complimentary membership; removing the last ends it. RLS: members see their own roles; admins see the team through staff_members(). Index: granted_by.",
        },
        {
          id: "staff_invites", color: colors.account, x: 420, y: 3330, sub: "roles waiting for sign-up",
          cols: [
            ["pk", "email", "text (lower case)"],
            ["pk", "role", "staff_role"],
            ["", "invited_at", "timestamptz"],
            ["fk", "invited_by", "uuid", true],
          ],
          note: "A role given to an email with no account yet; applied and cleared when that email signs up (trigger on auth.users). No browser access. Index: invited_by.",
        },
        {
          id: "legal_pages", color: colors.server, x: 840, y: 3330, sub: "footer policies · editable",
          cols: [
            ["pk", "slug", "text"],
            ["", "position", "smallint"],
            ["", "title", "text 1–80"],
            ["", "summary", "text 1–600"],
            ["", "sections", "jsonb (heading, paragraphs[])"],
            ["", "updated_at", "timestamptz"],
            ["fk", "updated_by", "uuid", true],
          ],
          note: "The thirteen live footer pages: Accessibility, Privacy, Cookies, Children's Privacy, Privacy Choices, Terms, EULA, Acceptable Use, Returns, Copyright/DMCA, Disclaimer, Help and Status (ordered by position). RLS: anyone reads; editors and admins edit title, summary and sections. Each edit is checked, stamped and its old version kept. Index: updated_by.",
        },
        {
          id: "legal_page_revisions", color: colors.server, x: 1260, y: 3330, sub: "earlier versions",
          cols: [
            ["pk", "id", "uuid"],
            ["fk", "slug", "text"],
            ["", "title", "text"],
            ["", "summary", "text"],
            ["", "sections", "jsonb"],
            ["", "replaced_at", "timestamptz"],
            ["fk", "replaced_by", "uuid", true],
          ],
          note: "Written by the edit trigger. RLS: editors and admins read. Indexes: (slug, replaced_at), replaced_by.",
        },
        {
          id: "stripe_customers", color: colors.billing, x: 0, y: 3790, sub: "server only",
          cols: [
            ["pk fk", "user_id", "uuid"],
            ["", "customer_id", "text (cus_…, unique)"],
            ["", "created_at", "timestamptz"],
          ],
          note: "Which Stripe Customer belongs to which account, written by the checkout function. Stripe events are mapped to accounts through it, not metadata. RLS on; no browser access.",
        },
        {
          id: "stripe_events", color: colors.billing, x: 420, y: 3790, sub: "webhook log · server only",
          cols: [
            ["pk", "id", "text (evt_…)"],
            ["", "type", "text"],
            ["", "object_id", "text", true],
            ["", "livemode", "boolean"],
            ["", "needs_review", "boolean"],
            ["", "received_at", "timestamptz"],
          ],
          note: "Each Stripe webhook event once (repeats skipped), written by stripe-webhook after it's handled. Disputes, refunds and fraud warnings need_review. Index: received_at where needs_review. RLS on; no browser access.",
        },
        {
          id: "gift_codes", color: colors.billing, x: 1260, y: 3790, sub: "gift memberships",
          cols: [
            ["pk", "id", "uuid"],
            ["", "code", "text (16, unique)"],
            ["fk", "plan_id", "text"],
            ["", "months", "smallint 1/3/6/12"],
            ["", "amount_cents", "integer"],
            ["", "currency", "char(3)"],
            ["fk", "buyer_id", "uuid", true],
            ["", "stripe_checkout_session_id", "text unique"],
            ["fk", "redeemed_by", "uuid", true],
            ["", "redeemed_at", "timestamptz", true],
            ["", "created_at", "timestamptz"],
          ],
          note: "Made by stripe-webhook when a gift Checkout is paid (one per session); redeemed once through manage-account. RLS: buyers read their own codes (not the Stripe session or who redeemed). Indexes: buyer_id, redeemed_by, plan_id.",
        },
      ];

      // [fromTable, fromColumn, toTable, toColumn, cardinality label]
      const relations = [
        ["profiles", "id", "auth.users", "id", "1 : 1"],
        ["account_private", "user_id", "auth.users", "id", "1 : 1"],
        ["subscriptions", "user_id", "auth.users", "id", "1 : 1"],
        ["subscriptions", "plan_id", "plans", "id", "N : 1"],
        ["reader_profiles", "account_id", "auth.users", "id", "N : 1"],
        ["parental_consents", "profile_id", "reader_profiles", "id", "N : 1"],
        ["parental_consents", "account_id", "auth.users", "id", "N : 1"],
        ["library_items", "user_id", "auth.users", "id", "N : 1"],
        ["logs", "user_id", "profiles", "id", "N : 1"],
        ["logs", "volume_id", "library_items", "volume_id", "N : 1 (pair)"],
        ["reading_progress", "volume_id", "library_items", "volume_id", "1 : 1 (pair)"],
        ["bookmarks", "volume_id", "library_items", "volume_id", "N : 1 (pair)"],
        ["highlights", "volume_id", "library_items", "volume_id", "N : 1 (pair)"],
        ["favorites", "profile_id", "reader_profiles", "id", "N : 1 (pair)"],
        ["follows", "profile_id", "reader_profiles", "id", "N : 1 (pair)"],
        ["author_news", "profile_id", "reader_profiles", "id", "N : 1 (pair)"],
        ["household_challenges", "user_id", "auth.users", "id", "N : 1"],
        ["changelog_entries", "created_by", "auth.users", "id", "N : 1"],
        ["whats_new_sends", "user_id", "auth.users", "id", "N : 1"],
        ["challenge_participants", "challenge_id", "household_challenges", "id", "N : 1 (pair)"],
        ["challenge_participants", "profile_id", "reader_profiles", "id", "N : 1 (pair)"],
        ["release_reminders", "profile_id", "reader_profiles", "id", "N : 1 (pair)"],
        ["book_ratings", "profile_id", "reader_profiles", "id", "N : 1 (pair)"],
        ["custom_lists", "profile_id", "reader_profiles", "id", "N : 1 (pair)"],
        ["custom_list_items", "list_id", "custom_lists", "id", "N : 1 (pair)"],
        ["reading_goals", "profile_id", "reader_profiles", "id", "N : 1 (pair)"],
        ["reading_days", "profile_id", "reader_profiles", "id", "N : 1 (pair)"],
        ["book_clubs", "owner_id", "profiles", "id", "N : 1"],
        ["club_members", "club_id", "book_clubs", "id", "N : 1"],
        ["club_invites", "club_id", "book_clubs", "id", "N : 1"],
        ["club_invites", "invited_by", "profiles", "id", "N : 1"],
        ["club_members", "user_id", "profiles", "id", "N : 1"],
        ["club_posts", "club_id", "club_members", "club_id", "N : 1 (pair)"],
        ["listening_devices", "user_id", "auth.users", "id", "N : 1"],
        ["offline_devices", "user_id", "auth.users", "id", "N : 1"],
        ["support_lookups", "staff_id", "auth.users", "id", "N : 1"],
        ["support_lookups", "member_id", "auth.users", "id", "N : 1"],
        ["playback_handoffs", "to_device_id", "listening_devices", "id", "N : 1 (pair)"],
        ["playback_handoffs", "profile_id", "reader_profiles", "id", "N : 1 (pair)"],
        ["finished_books", "profile_id", "reader_profiles", "id", "N : 1 (pair)"],
        ["uploaded_books", "profile_id", "reader_profiles", "id", "N : 1 (pair)"],
        ["club_listening", "club_id", "book_clubs", "id", "1 : 1"],
        ["club_listening", "host_id", "club_members", "user_id", "N : 1 (pair)"],
        ["staff_roles", "user_id", "auth.users", "id", "N : 1"],
        ["stripe_customers", "user_id", "auth.users", "id", "1 : 1"],
        ["gift_codes", "buyer_id", "auth.users", "id", "N : 1"],
        ["gift_codes", "redeemed_by", "auth.users", "id", "N : 1"],
        ["gift_codes", "plan_id", "plans", "id", "N : 1"],
        ["legal_page_revisions", "slug", "legal_pages", "slug", "N : 1"],
      ];
      // -----------------------------------------------------------------------------------

      document.getElementById("subtitle").textContent = subtitle;
      const groups = document.getElementById("groups");
      const el = (tag, cls, text) => {
        const n = document.createElement(tag);
        if (cls) n.className = cls;
        if (text !== undefined) n.textContent = text;
        return n;
      };

      let maxY = 0;
      for (const t of tables) {
        const card = el("section", "table");
        card.dataset.id = t.id;
        card.style.left = t.x + "px";
        card.style.top = t.y + "px";
        const h = el("h2");
        h.style.background = t.color;
        h.append(el("span", "", t.id), el("small", "", t.sub ?? ""));
        card.append(h);
        for (const [key, name, type, nullable] of t.cols) {
          const row = el("div", "row");
          row.dataset.col = name;
          const k = el("span", "k " + key.split(" ")[0], key.toUpperCase().replace(" ", "/"));
          const n = el("span", "name", name);
          if (nullable) n.append(el("span", "null", "?"));
          row.append(k, n, el("span", "type", type));
          card.append(row);
        }
        if (t.note) card.append(el("div", "note", t.note));
        groups.append(card);
      }

      // Draw relation lines after layout.
      requestAnimationFrame(() => {
        const box = groups.getBoundingClientRect();
        for (const c of groups.querySelectorAll(".table")) maxY = Math.max(maxY, c.offsetTop + c.offsetHeight);
        groups.style.height = maxY + 40 + "px";
        const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
        svg.id = "edges";
        svg.setAttribute("width", box.width);
        svg.setAttribute("height", maxY + 40);
        const rowRect = (table, col) => {
          const r = groups.querySelector(`.table[data-id="${table}"] .row[data-col="${col}"]`).getBoundingClientRect();
          return { l: r.left - box.left, r: r.right - box.left, y: r.top - box.top + r.height / 2 };
        };
        for (const [ft, fc, tt, tc, label] of relations) {
          const a = rowRect(ft, fc);
          const b = rowRect(tt, tc);
          // Leave from the side facing the target.
          const goLeft = b.r < a.l;
          const sameColumn = !goLeft && b.l < a.r;
          let x1, x2, path;
          if (sameColumn) {
            x1 = a.l; x2 = b.l;
            const bend = Math.min(x1, x2) - 34;
            path = `M${x1},${a.y} C${bend},${a.y} ${bend},${b.y} ${x2},${b.y}`;
          } else {
            x1 = goLeft ? a.l : a.r;
            x2 = goLeft ? b.r : b.l;
            const mid = (x1 + x2) / 2;
            path = `M${x1},${a.y} C${mid},${a.y} ${mid},${b.y} ${x2},${b.y}`;
          }
          const p = document.createElementNS(svg.namespaceURI, "path");
          p.setAttribute("d", path);
          p.setAttribute("class", "edge");
          svg.append(p);
          // Crow's-foot-ish end markers: a bar at the "one" end, a dot at the FK end.
          const dot = document.createElementNS(svg.namespaceURI, "circle");
          dot.setAttribute("cx", x1); dot.setAttribute("cy", a.y); dot.setAttribute("r", 3.5);
          dot.setAttribute("fill", "var(--fk)");
          const bar = document.createElementNS(svg.namespaceURI, "line");
          bar.setAttribute("x1", x2 + (goLeft ? 6 : -6)); bar.setAttribute("x2", x2 + (goLeft ? 6 : -6));
          bar.setAttribute("y1", b.y - 7); bar.setAttribute("y2", b.y + 7);
          bar.setAttribute("stroke", "var(--pk)"); bar.setAttribute("stroke-width", 2);
          const t = document.createElementNS(svg.namespaceURI, "text");
          t.setAttribute("class", "card-label");
          t.setAttribute("x", (x1 + x2) / 2 + (sameColumn ? -60 : 0));
          t.setAttribute("y", (a.y + b.y) / 2 - 6);
          t.setAttribute("text-anchor", "middle");
          t.textContent = label;
          svg.append(dot, bar, t);
        }
        groups.prepend(svg);
        document.body.dataset.ready = "true";
      });
    </script>
  </body>
