<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Termly's consent banner and resource blocker: it must stay the first script on the page. -->
    <script src="https://app.termly.io/resource-blocker/4e27b37a-9ee5-49bd-8bfa-4f11f17546fa?autoBlock=on"></script>
    <!-- Ahrefs Web Analytics (no cookies): Termly holds it back until analytics is allowed. It sends no page views
         on its own (data-no-pageview-auto); components/Analytics.tsx sends each one as the path only, and pauses it
         for Kids profiles and pages with codes in their links (lib/analytics.ts). -->
    <script src="https://analytics.ahrefs.com/analytics.js" data-key="1Vx+cjIdVgteSlA/dtRTcA" data-no-pageview-auto data-categories="analytics" async></script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="author" href="/humans.txt" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="LiteraryWorm" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0d0f" />
    <meta name="description" content="Read ebooks and listen to audiobooks in one place, with a profile for everyone at home. Basic $15.00, Standard $20.00 or Premium $30.00 a month, or pay yearly and get two months free." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="LiteraryWorm" />
    <meta property="og:title" content="LiteraryWorm: read and listen in one place" />
    <meta property="og:description" content="Read ebooks and listen to audiobooks in one place, with a profile for everyone at home. Basic $15.00, Standard $20.00 or Premium $30.00 a month, or pay yearly and get two months free." />
    <meta property="og:url" content="https://www.literaryworm.com/" />
    <meta property="og:image" content="https://www.literaryworm.com/icons/icon-512.png" />
    <meta name="twitter:card" content="summary" />
    <!-- Site-wide structured data, built from src/lib/seo.ts (seo.test.ts checks they match); pages add their own. -->
    <script type="application/ld+json">
      [
        {
          "@context": "https://schema.org",
          "@type": "WebSite",
          "@id": "https://www.literaryworm.com/#website",
          "name": "LiteraryWorm",
          "url": "https://www.literaryworm.com/",
          "description": "Read ebooks and listen to audiobooks in one place, with a profile for everyone at home. Basic $15.00, Standard $20.00 or Premium $30.00 a month, or pay yearly and get two months free.",
          "inLanguage": "en",
          "publisher": {
            "@id": "https://www.literaryworm.com/#organization"
          },
          "potentialAction": {
            "@type": "SearchAction",
            "target": {
              "@type": "EntryPoint",
              "urlTemplate": "https://www.literaryworm.com/search?q={search_term_string}"
            },
            "query-input": "required name=search_term_string"
          }
        },
        {
          "@context": "https://schema.org",
          "@type": "Organization",
          "@id": "https://www.literaryworm.com/#organization",
          "name": "LiteraryWorm",
          "url": "https://www.literaryworm.com/",
          "logo": "https://www.literaryworm.com/icons/icon-512.png",
          "email": "support@literaryworm.com",
          "contactPoint": {
            "@type": "ContactPoint",
            "contactType": "customer support",
            "email": "support@literaryworm.com",
            "availableLanguage": "English"
          }
        }
      ]
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Manrope:wght@600;700;800&family=Lexend:wght@400;600&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&display=swap" rel="stylesheet" />
    <title>LiteraryWorm</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
